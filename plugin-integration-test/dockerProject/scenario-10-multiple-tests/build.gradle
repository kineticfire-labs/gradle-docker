/**
 * Scenario 10: Multiple Test Configurations
 *
 * Demonstrates:
 * - The `tests { }` DSL for defining multiple named test configurations
 * - Different lifecycle modes per test configuration (CLASS vs METHOD)
 * - Different compose files per test configuration
 * - Test class filtering via testClasses patterns
 *
 * Ports allocated:
 * - 9310: apiTests configuration
 * - 9311: statefulTests configuration
 *
 * This scenario uses the `tests { }` block which is mutually exclusive with `test { }`.
 * Each named test configuration generates a separate test task:
 * - apiTests → ApiTestsIntegrationTest
 * - statefulTests → StatefulTestsIntegrationTest
 */

plugins {
    id 'base'
}

description = 'DockerProject Scenario 10: Multiple Test Configurations'

// Aggregate task to run all scenario tests
tasks.register('integrationTest') {
    group = 'verification'
    description = 'Run all multiple test configuration integration tests'
    dependsOn ':dockerProject:scenario-10-multiple-tests:app-image:integrationTest'
}

// Aggregate task to clean all subprojects
tasks.named('clean') {
    dependsOn ':dockerProject:scenario-10-multiple-tests:app-image:clean'
}
