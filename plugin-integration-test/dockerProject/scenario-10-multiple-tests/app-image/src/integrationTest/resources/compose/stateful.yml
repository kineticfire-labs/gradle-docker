# Docker Compose for dockerProject scenario-10 Stateful Tests
# Port 9311 is allocated for dockerProject scenario 10 statefulTests (per README conventions).
#
# This compose file is used with the 'statefulTests' test configuration which uses
# METHOD lifecycle - containers restart for each test method. Use this for tests
# that modify state and require isolation between test methods.

services:
  app:
    image: project-scenario10-app:latest
    ports:
      - "9311:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
